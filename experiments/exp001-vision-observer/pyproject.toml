[project]
name = "exp001-vision-observer"
version = "0.1.0"
description = "Experiment 1: an overhead webcam judges robot commands instead of a human."
requires-python = ">=3.12"
dependencies = ["lab-agent", "numpy>=2", "opencv-python-headless>=4.10"]

[project.optional-dependencies]
hardware = ["lab-agent[broadlink]"]

[project.scripts]
exp001 = "exp001_vision_observer.cli:main"

[tool.uv.sources]
lab-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp001_vision_observer"]
