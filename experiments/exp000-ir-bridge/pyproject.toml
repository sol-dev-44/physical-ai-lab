[project]
name = "exp000-ir-bridge"
version = "0.1.0"
description = "Experiment 0: drive IR devices through the harness."
requires-python = ">=3.12"
dependencies = ["lab-agent"]

[project.optional-dependencies]
hardware = ["lab-agent[broadlink,kasa]"]

[tool.uv.sources]
lab-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp000_ir_bridge"]
