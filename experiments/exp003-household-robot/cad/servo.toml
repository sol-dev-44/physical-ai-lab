# STS3215 wheel-servo measurements for the wheel hub. How to take each one: MEASURING.md.
# Measured 2026-11-17 on a spare STS3215-12V with its 4-hole aluminium horn fitted.
measured = true

[horn]
od_mm = 19.9                # A: outside diameter of the round horn
thickness_mm = 2.08         # B: thickness of the horn disc
bolt_count = 4              # C: screw holes around the horn (not counting the centre screw)
bolt_circle_mm = 13.6       # D: centre-to-centre across the holes (16.6 outside edges - 3.0 hole)
bolt_size = "M3"            # E: screw that threads into the holes
center_head_mm = 5.0        # F: centre screw head diameter
center_head_height_mm = 2.0 # G: how far the centre screw head stands above the horn face
shaft_height_mm = 4.0       # H: horn top face down to the top of the servo case

# The screws on hand: the lab's Mywish 1290-piece M2-M5 kit (button-head hex socket, ISO 7380).
# Its M3 lengths are 8, 12, 16 and 20 mm; the model thickens the hub to suit the shortest.
[screws]
head = "button"
lengths_mm = [8, 12, 16, 20]
