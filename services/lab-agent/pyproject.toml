[project]
name = "lab-agent"
version = "0.1.0"
description = "The only process allowed to touch lab hardware: tool registry, safety gate, device adapters, event log."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
broadlink = ["broadlink>=0.19"]
kasa = ["python-kasa>=0.10"]

[project.scripts]
lab = "lab_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_agent"]
